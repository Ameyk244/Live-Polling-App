<!--
  Manual-testing / demo UI ONLY — not a production frontend.
  Plain HTML/CSS/JS, no build step, no framework. Served by the backend itself at
  http://127.0.0.1:8000/ (see app/main.py's StaticFiles mount). Consistent with this
  project's CLAUDE.md scope notes.

  Routing: "/" = landing choice screen. "#host/{code}" = host's live hosting view
  (only reachable in-session, right after creating that poll in this tab/browser —
  a host token can't be reconstructed from the URL alone, so a direct/refreshed load
  at this hash shows a "session not found" message instead of erroring unclearly).
  "#join/{code}" = participant's voting view, same in-session caveat.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Live Polling App — Demo</title>
<style>
  :root {
    --accent: #4f46e5;
    --accent-dark: #3f37c9;
    --accent-soft: #eef0ff;
    --ink: #1a1a1e;
    --ink-soft: #5a5a63;
    --border: #dfe0e6;
    --bg: #f5f5f8;
    --surface: #ffffff;
    --danger: #b3261e;
    --danger-bg: #fdecea;
    /* Text-safe variants of the fixed donut palette (DONUT_COLORS in the
       script below) — darker shades of the same hues, legible as text on a
       light --surface. Index-matched: --donut-text-0 pairs with
       DONUT_COLORS[0], etc. The swatches/slices stay vivid; only the count
       numbers use these. */
    --donut-text-0: #4338ca;
    --donut-text-1: #b45309;
    --donut-text-2: #047857;
    --donut-text-3: #be185d;
    --donut-text-4: #0e7490;
    --donut-text-5: #c2410c;
    --donut-text-6: #6d28d9;
    --donut-text-7: #4d7c0f;
  }
  body.dark-mode {
    --ink: #eef0f5;
    --ink-soft: #a2a3ad;
    --border: #3a3a44;
    --bg: #121214;
    --surface: #1c1c22;
    --danger: #f87171;
    --danger-bg: #3a1f1f;
    /* Lighter shades of the same hues, legible as text on the dark --surface. */
    --donut-text-0: #a5b4fc;
    --donut-text-1: #fbbf24;
    --donut-text-2: #6ee7b7;
    --donut-text-3: #f9a8d4;
    --donut-text-4: #67e8f9;
    --donut-text-5: #fdba74;
    --donut-text-6: #c4b5fd;
    --donut-text-7: #bef264;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.01em;
    color: var(--ink);
  }
  .topbar .dot { color: var(--accent); }
  .theme-toggle {
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    color: var(--ink);
    font-size: 0.95rem;
    line-height: 1;
  }
  .theme-toggle:hover { border-color: var(--accent); }
  .page {
    max-width: 560px;
    margin: 0 auto;
    padding: 12px 20px 60px;
  }
  .view.hidden { display: none; }

  h1 { font-size: 1.6rem; margin: 0 0 6px; }
  h2 { font-size: 1.15rem; margin: 0 0 16px; }
  .subtitle { color: var(--ink-soft); margin: 0 0 32px; font-size: 0.95rem; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 1px 2px rgba(20, 20, 40, 0.04);
  }

  /* ---------- landing ---------- */
  .landing-choices {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .choice-card {
    display: flex;
    align-items: center;
    gap: 16px;
    text-align: left;
    width: 100%;
    padding: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
  }
  .choice-card:hover {
    border-color: var(--accent);
    box-shadow: 0 4px 14px rgba(79, 70, 229, 0.12);
    transform: translateY(-1px);
  }
  .choice-icon {
    flex: 0 0 auto;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: var(--accent-soft);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    font-weight: 700;
  }
  .choice-title { display: block; font-weight: 600; font-size: 1.02rem; color: var(--ink); }
  .choice-desc { display: block; font-size: 0.85rem; color: var(--ink-soft); margin-top: 2px; }

  /* ---------- forms ---------- */
  label { display: block; font-size: 0.85rem; margin: 14px 0 6px; color: var(--ink-soft); font-weight: 500; }
  input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    font-family: inherit;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .option-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .option-row input { flex: 1; }

  button {
    font-family: inherit;
    cursor: pointer;
    border-radius: 8px;
    font-size: 0.92rem;
  }
  .btn-primary {
    display: inline-block;
    margin-top: 18px;
    padding: 10px 18px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    transition: background 0.15s ease;
  }
  .btn-primary:hover:not(:disabled) { background: var(--accent-dark); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-secondary {
    padding: 6px 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

  .btn-danger-outline {
    margin-top: 18px;
    padding: 10px 18px;
    border: 1px solid var(--danger);
    background: var(--surface);
    color: var(--danger);
    font-weight: 600;
  }
  .btn-danger-outline:hover:not(:disabled) { background: var(--danger-bg); }
  .btn-danger-outline:disabled { opacity: 0.5; cursor: not-allowed; }

  .back-link {
    display: inline-block;
    margin-bottom: 16px;
    color: var(--ink-soft);
    font-size: 0.85rem;
    text-decoration: none;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
  }
  .back-link:hover { color: var(--accent); }

  /* ---------- hosting / voting live views ---------- */
  .code-display {
    font-size: 2.4rem;
    font-weight: 800;
    letter-spacing: 0.18em;
    text-align: center;
    padding: 18px 10px;
    margin: 4px 0 20px;
    background: var(--accent-soft);
    color: var(--accent-dark);
    border-radius: 10px;
    user-select: all;
  }
  .code-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 4px 0 20px;
  }
  .code-row .code-display { flex: 1; margin: 0; }
  .btn-copy-code {
    flex: 0 0 auto;
    padding: 8px 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    align-self: stretch;
  }
  .btn-copy-code:hover { border-color: var(--accent); color: var(--accent); }
  .qr-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin: 0 0 20px;
  }
  .qr-block img, .qr-block canvas, .qr-block table { border-radius: 8px; }
  .qr-caption { font-size: 0.8rem; color: var(--ink-soft); }
  .question-display {
    font-size: 1.2rem;
    font-weight: 600;
    margin: 0 0 20px;
    line-height: 1.4;
  }
  .donut-wrap {
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    margin: 14px 0;
  }
  .donut-chart { width: 160px; height: 160px; flex: 0 0 auto; }
  .donut-center-count { fill: var(--ink); font-size: 30px; font-weight: 800; }
  .donut-center-label { fill: var(--ink-soft); font-size: 12px; }
  .donut-legend { flex: 1 1 160px; min-width: 140px; }
  .donut-legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.88rem;
    margin: 8px 0;
  }
  .donut-swatch {
    flex: 0 0 auto;
    width: 12px;
    height: 12px;
    border-radius: 3px;
  }
  .donut-legend-text { flex: 1; color: var(--ink); font-weight: 500; }
  .donut-legend-count { color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  .option-choice {
    display: block;
    width: 100%;
    text-align: left;
    margin-top: 10px;
    padding: 12px 14px;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--border);
    font-weight: 500;
  }
  .option-choice:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .option-choice:disabled { opacity: 0.55; cursor: not-allowed; }

  .hidden { display: none; }
  .error-line { color: var(--danger); font-size: 0.85rem; margin-top: 10px; min-height: 1em; }
  .status-line { font-size: 0.9rem; color: var(--ink-soft); margin-top: 10px; }
  .export-row { display: flex; gap: 10px; margin-top: 16px; }
  .export-row .btn-secondary { flex: 1; }
  #host-analytics-toggle { width: 100%; margin-top: 10px; }
  #host-analytics-panel { margin-top: 10px; padding: 16px; }
  .analytics-line { font-size: 0.9rem; color: var(--ink); margin: 4px 0; }
  .analytics-line strong { color: var(--ink-soft); font-weight: 500; }
  .closed-banner {
    margin-top: 16px;
    padding: 12px 14px;
    background: var(--danger-bg);
    color: var(--danger);
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 500;
  }
  .no-session-message {
    color: var(--ink-soft);
    font-size: 0.92rem;
    line-height: 1.5;
  }
</style>
</head>
<body>
<script>
  // Apply any previously-saved theme choice as early as possible (before the
  // rest of the body is parsed/painted) to avoid a flash of the wrong theme.
  // Wrapped in try/catch since localStorage can throw in some contexts
  // (e.g. privacy modes) — falls back to the default light theme.
  try {
    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark-mode");
    }
  } catch (err) {}
</script>

<div class="topbar">
  <span><span class="dot">●</span> Live Polling</span>
  <button type="button" class="theme-toggle" id="theme-toggle-btn" aria-label="Toggle dark mode">🌙</button>
</div>

<div class="page">

  <!-- ==================== LANDING ==================== -->
  <div class="view" id="view-landing">
    <h1>Live Polling</h1>
    <p class="subtitle">Create a quick poll, or join one with a code.</p>
    <div class="landing-choices">
      <button type="button" class="choice-card" id="btn-go-create">
        <span class="choice-icon">+</span>
        <span>
          <span class="choice-title">Create a Poll</span>
          <span class="choice-desc">Set a question, share the code, watch results live.</span>
        </span>
      </button>
      <button type="button" class="choice-card" id="btn-go-join">
        <span class="choice-icon">&#8594;</span>
        <span>
          <span class="choice-title">Join a Poll</span>
          <span class="choice-desc">Enter a code from the host and cast your vote.</span>
        </span>
      </button>
    </div>
  </div>

  <!-- ==================== HOST: CREATE FORM ==================== -->
  <div class="view hidden" id="view-create-form">
    <button type="button" class="back-link" id="create-back-link">&#8592; Back</button>
    <div class="card">
      <h2>Create a Poll</h2>
      <label for="host-question">Question</label>
      <input type="text" id="host-question" placeholder="What's your favorite color?" />

      <label>Options</label>
      <div id="host-options"></div>
      <button type="button" class="btn-secondary" id="host-add-option">+ Add option</button>

      <label for="host-duration">Duration (minutes, optional)</label>
      <input type="text" id="host-duration" placeholder="e.g. 30 — leave blank to never auto-close" />

      <br />
      <button type="button" class="btn-primary" id="host-create-btn">Create Poll</button>
      <div class="error-line" id="host-create-error"></div>

  </div>

  <!-- ==================== HOST: HOSTING VIEW ==================== -->
  <div class="view hidden" id="view-hosting">

    <div class="card" id="host-no-session-block">

      <button type="button" class="btn-secondary" id="host-analytics-toggle">View Analytics &#9662;</button>

  <!-- ==================== PARTICIPANT: JOIN FORM ==================== -->
  <div class="view hidden" id="view-join-form">

    <div class="card">
      <h2>Join a Poll</h2>

      <label for="participant-name">Display name</label>

  <!-- ==================== PARTICIPANT: VOTING VIEW ==================== -->

      <div class="status-line hidden" id="participant-expires-line"></div>

      <div class="status-line" id="participant-status"></div>

</div>

<!-- Socket.IO client from CDN -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<!-- QR code generator from CDN (vanilla JS, no build step) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  // The frontend is always served BY the same FastAPI app it talks to, so the
  // backend is whatever origin this page was loaded from — works unchanged
  // locally (http://127.0.0.1:8000) and on any deployed URL (e.g. Render).
  const BACKEND_URL = window.location.origin;

  // ---------------------------------------------------------------------
  // Shared helpers
  // ---------------------------------------------------------------------
  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  // No live countdown here on purpose — just tells the viewer when the poll
  // will close, formatted in their own local time. Hidden entirely when the
  // poll has no expiry set.
  function renderExpiresLine(elId, expiresAt) {
    const el = document.getElementById(elId);
    if (!expiresAt) {
      el.classList.add("hidden");
      el.textContent = "";
      return;
    }
    const formatted = new Date(expiresAt).toLocaleTimeString();
    el.textContent = `Expires at: ${formatted}`;
    el.classList.remove("hidden");
  }

  // Small fixed palette for donut slices / legend swatches. Cycles if there
  // are more options than colors (unlikely in practice for a poll).
  const DONUT_COLORS = [
    "#4f46e5", // indigo
    "#f59e0b", // amber
    "#10b981", // emerald
    "#ec4899", // pink
    "#06b6d4", // cyan
    "#f97316", // orange
    "#8b5cf6", // violet
    "#84cc16", // lime
  ];

  // Renders a hand-rolled SVG donut chart (no charting library) into
  // `container`, plus a color-keyed legend with counts. Angle for each
  // option's slice = (count / totalVotes) * 2π, accumulated from a running
  // start angle so slices sit end-to-end around the circle.
  function renderTallyBars(container, tally) {
    container.innerHTML = "";
    const sorted = [...tally].sort((a, b) => a.position - b.position);
    const total = sorted.reduce((sum, t) => sum + t.count, 0);

    const size = 160;
    const cx = size / 2;
    const cy = size / 2;
    const outerR = 76;
    const innerR = 46;
    const svgNS = "http://www.w3.org/2000/svg";

    // angle 0 = straight up, increasing clockwise (matches how a clock/pie
    // chart reads visually).
    function pointAt(radius, angleRad) {
      return {
        x: cx + radius * Math.sin(angleRad),
        y: cy - radius * Math.cos(angleRad),
      };
    }

    function donutSlicePath(startAngle, endAngle) {
      const largeArc = endAngle - startAngle > Math.PI ? 1 : 0;
      const outerStart = pointAt(outerR, startAngle);
      const outerEnd = pointAt(outerR, endAngle);
      const innerEnd = pointAt(innerR, endAngle);
      const innerStart = pointAt(innerR, startAngle);
      return [
        `M ${outerStart.x} ${outerStart.y}`,
        `A ${outerR} ${outerR} 0 ${largeArc} 1 ${outerEnd.x} ${outerEnd.y}`,
        `L ${innerEnd.x} ${innerEnd.y}`,
        `A ${innerR} ${innerR} 0 ${largeArc} 0 ${innerStart.x} ${innerStart.y}`,
        "Z",
      ].join(" ");
    }

    const svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("viewBox", `0 0 ${size} ${size}`);
    svg.setAttribute("class", "donut-chart");
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", "Vote distribution donut chart");

    if (total === 0) {
      // Nothing to divide up yet — an empty grey ring rather than a
      // divide-by-zero slice.
      const ring = document.createElementNS(svgNS, "circle");
      ring.setAttribute("cx", cx);
      ring.setAttribute("cy", cy);
      ring.setAttribute("r", (outerR + innerR) / 2);
      ring.setAttribute("fill", "none");
      ring.setAttribute("stroke", "var(--border)");
      ring.setAttribute("stroke-width", outerR - innerR);
      svg.appendChild(ring);
    } else {
      let angle = 0;
      sorted.forEach((t, i) => {
        if (t.count <= 0) return;
        const sliceAngle = (t.count / total) * 2 * Math.PI;
        const path = document.createElementNS(svgNS, "path");
        path.setAttribute("d", donutSlicePath(angle, angle + sliceAngle));
        path.setAttribute("fill", DONUT_COLORS[i % DONUT_COLORS.length]);
        svg.appendChild(path);
        angle += sliceAngle;
      });
    }

    const centerCount = document.createElementNS(svgNS, "text");
    centerCount.setAttribute("x", cx);
    centerCount.setAttribute("y", cy - 2);
    centerCount.setAttribute("text-anchor", "middle");
    centerCount.setAttribute("class", "donut-center-count");
    centerCount.textContent = total;
    svg.appendChild(centerCount);

    const centerLabel = document.createElementNS(svgNS, "text");
    centerLabel.setAttribute("x", cx);
    centerLabel.setAttribute("y", cy + 16);
    centerLabel.setAttribute("text-anchor", "middle");
    centerLabel.setAttribute("class", "donut-center-label");
    centerLabel.textContent = total === 1 ? "vote" : "votes";
    svg.appendChild(centerLabel);

    const legend = document.createElement("div");
    legend.className = "donut-legend";
    sorted.forEach((t, i) => {
      const item = document.createElement("div");
      item.className = "donut-legend-item";
      const color = total === 0 ? "var(--border)" : DONUT_COLORS[i % DONUT_COLORS.length];
      const textColor = total === 0 ? "var(--ink-soft)" : `var(--donut-text-${i % DONUT_COLORS.length})`;
      const swatch = document.createElement("span");
      swatch.className = "donut-swatch";
      swatch.style.background = color;
      const text = document.createElement("span");
      text.className = "donut-legend-text";
      text.textContent = t.text;
      const count = document.createElement("span");
      count.className = "donut-legend-count";
      count.textContent = t.count;
      count.style.color = textColor;
      count.style.fontWeight = "700";
      item.append(swatch, text, count);
      legend.appendChild(item);
    });

    const wrap = document.createElement("div");
    wrap.className = "donut-wrap";
    wrap.append(svg, legend);
    container.appendChild(wrap);
  }

  // ---------------------------------------------------------------------
  // View routing
  // ---------------------------------------------------------------------
  const VIEW_IDS = ["landing", "create-form", "hosting", "join-form", "voting"];

  function showView(name) {
    for (const id of VIEW_IDS) {
      document.getElementById("view-" + id).classList.toggle("hidden", id !== name);
    }
  }

  function setHostSubview(mode) {
    document.getElementById("host-no-session-block").classList.toggle("hidden", mode !== "no-session");
    document.getElementById("host-live-block").classList.toggle("hidden", mode !== "live");
  }

  function setJoinSubview(mode) {
    document.getElementById("join-no-session-block").classList.toggle("hidden", mode !== "no-session");
    document.getElementById("join-live-block").classList.toggle("hidden", mode !== "live");
  }

  function route() {
    const hash = location.hash.replace(/^#/, "");
    const [name, code] = hash.split("/");

    if (name === "host" && code) {
      showView("hosting");
      if (hostToken && hostPollCode === code) {
        setHostSubview("live");
      } else {
        document.getElementById("host-no-session-message").textContent =
          `Host session not found for poll ${code} — this view only works right ` +
          `after creating the poll in this browser session.`;
        setHostSubview("no-session");
      }
    } else if (name === "join" && code) {
      if (participantToken && participantPollCode === code) {
        showView("voting");
        setJoinSubview("live");
      } else {
        // No active in-session token for this code yet (e.g. someone scanning
        // a QR code and landing here fresh) — send them to the join form with
        // the code pre-filled instead of a dead-end "session not found" page.
        showView("join-form");
        document.getElementById("participant-code").value = code;
      }
    } else {
      showView("landing");
    }
  }

  function goToLanding() {
    if (hostSocket) { hostSocket.disconnect(); hostSocket = null; }
    if (participantSocket) { participantSocket.disconnect(); participantSocket = null; }
    hostToken = null;
    hostPollCode = null;
    analyticsLoaded = false;
    document.getElementById("host-analytics-panel").classList.add("hidden");
    participantToken = null;
    participantPollCode = null;
    hasAnswered = false;
    location.hash = "";
    showView("landing");
  }

  window.addEventListener("hashchange", route);
  document.getElementById("btn-go-create").addEventListener("click", () => showView("create-form"));
  document.getElementById("btn-go-join").addEventListener("click", () => showView("join-form"));
  document.getElementById("create-back-link").addEventListener("click", () => showView("landing"));
  document.getElementById("join-back-link").addEventListener("click", () => showView("landing"));
  document.getElementById("host-start-over-link").addEventListener("click", goToLanding);
  document.getElementById("join-start-over-link").addEventListener("click", goToLanding);

  // ---------------------------------------------------------------------
  // Theme toggle (light/dark). The class itself may already be applied by
  // the early inline script in <head>/<body> (to avoid a flash of the wrong
  // theme) — this just syncs the button icon to match on load, and handles
  // toggling + persistence from then on.
  // ---------------------------------------------------------------------
  const themeToggleBtn = document.getElementById("theme-toggle-btn");

  function syncThemeToggleIcon() {
    themeToggleBtn.textContent = document.body.classList.contains("dark-mode") ? "☀️" : "🌙";
  }

  themeToggleBtn.addEventListener("click", () => {
    const isDark = document.body.classList.toggle("dark-mode");
    try {
      localStorage.setItem("theme", isDark ? "dark" : "light");
    } catch (err) {
      // localStorage can throw in some contexts (e.g. privacy modes) —
      // the toggle still works for the current page view either way.
    }
    syncThemeToggleIcon();
  });

  syncThemeToggleIcon();

  // ---------------------------------------------------------------------
  // HOST FLOW
  // ---------------------------------------------------------------------
  let hostToken = null;
  let hostPollCode = null;
  let hostSocket = null;

  // Renders (or re-renders) the "scan to join" QR code for a freshly created
  // poll. qrcodejs clears/replaces its container's contents on each call, so
  // it's safe to call this again if needed.
  function renderHostJoinQr(code) {
    const container = document.getElementById("host-qr-code");
    container.innerHTML = "";
    const joinUrl = `${window.location.origin}/#join/${code}`;
    new QRCode(container, {
      text: joinUrl,
      width: 132,
      height: 132,
      colorDark: "#4f46e5",
      colorLight: "#ffffff",
    });
  }

  document.getElementById("host-copy-code-btn").addEventListener("click", async () => {
    const btn = document.getElementById("host-copy-code-btn");
    const code = document.getElementById("host-code").textContent;
    if (!code) return;
    try {
      await navigator.clipboard.writeText(code);
      btn.textContent = "Copied!";
      setTimeout(() => {
        btn.textContent = "Copy";
      }, 1500);
    } catch (err) {
      // Clipboard access can be denied/unavailable (e.g. non-HTTPS,
      // non-localhost contexts) — fail silently rather than breaking the page.
    }
  });

  const hostOptionsDiv = document.getElementById("host-options");

  function addHostOptionInput(prefill = "") {
    const row = document.createElement("div");
    row.className = "option-row";
    row.innerHTML = `<input type="text" class="host-option-input" placeholder="Option text" />`;
    hostOptionsDiv.appendChild(row);
    if (prefill) row.querySelector("input").value = prefill;
  }
  addHostOptionInput();
  addHostOptionInput();

  document.getElementById("host-add-option").addEventListener("click", () => addHostOptionInput());

  document.getElementById("host-create-btn").addEventListener("click", async () => {
    const errorEl = document.getElementById("host-create-error");
    errorEl.textContent = "";

    const question = document.getElementById("host-question").value.trim();
    const options = Array.from(document.querySelectorAll(".host-option-input"))
      .map((el) => el.value.trim())
      .filter((v) => v.length > 0);

    const durationRaw = document.getElementById("host-duration").value.trim();
    let duration_minutes = null;
    if (durationRaw) {
      const parsed = parseInt(durationRaw, 10);
      if (!Number.isInteger(parsed) || parsed < 1 || parsed > 1440) {
        errorEl.textContent = "Duration must be a whole number of minutes between 1 and 1440.";
        return;
      }
      duration_minutes = parsed;
    }

    if (!question || options.length < 2) {
      errorEl.textContent = "Enter a question and at least 2 non-empty options.";
      return;
    }

    try {
      const body = { question, options };
      if (duration_minutes !== null) body.duration_minutes = duration_minutes;
      const res = await fetch(`${BACKEND_URL}/polls`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) {
        errorEl.textContent = data.message || "Failed to create poll.";
        return;
      }

      hostToken = data.host_token;
      hostPollCode = data.code;
      analyticsLoaded = false;
      document.getElementById("host-analytics-panel").classList.add("hidden");

      document.getElementById("host-code").textContent = data.code;
      renderHostJoinQr(data.code);
      document.getElementById("host-question-display").textContent = data.poll.question;
      renderExpiresLine("host-expires-line", data.poll.expires_at);
      document.getElementById("host-participant-count").textContent = "0 participants connected";
      document.getElementById("host-closed-banner").classList.add("hidden");
      document.getElementById("host-close-btn").disabled = false;
      document.getElementById("host-error").textContent = "";

      showView("hosting");
      setHostSubview("live");
      connectHostSocket();
      location.hash = "#host/" + data.code;
    } catch (err) {
      errorEl.textContent = "Could not reach backend: " + err.message;
    }
  });

  function connectHostSocket() {
    hostSocket = io(BACKEND_URL);

    hostSocket.on("connect", () => {
      hostSocket.emit("join_as_host", { token: hostToken }, (ack) => {
        if (ack && ack.poll) {
          renderTallyBars(document.getElementById("host-tally"), ack.tally);
        }
      });
    });

    hostSocket.on("tally_update", (tally) => {
      renderTallyBars(document.getElementById("host-tally"), tally);
    });

    hostSocket.on("participant_count", (data) => {
      document.getElementById("host-participant-count").textContent = `${data.count} participant${data.count === 1 ? "" : "s"} connected`;
    });

    hostSocket.on("poll_closed", () => {
      document.getElementById("host-closed-banner").classList.remove("hidden");
      document.getElementById("host-close-btn").disabled = true;
    });

    hostSocket.on("error", (err) => {
      document.getElementById("host-error").textContent = err.message || "Something went wrong.";
    });
  }

  document.getElementById("host-close-btn").addEventListener("click", async () => {
    const errorEl = document.getElementById("host-error");
    errorEl.textContent = "";
    try {
      const res = await fetch(`${BACKEND_URL}/polls/${hostPollCode}/close`, {
        method: "POST",
        headers: { Authorization: `Bearer ${hostToken}` },
      });
      const data = await res.json();
      if (!res.ok) {
        errorEl.textContent = data.message || "Failed to close poll.";
        return;
      }
      document.getElementById("host-closed-banner").classList.remove("hidden");
      document.getElementById("host-close-btn").disabled = true;
    } catch (err) {
      errorEl.textContent = "Could not reach backend: " + err.message;
    }
  });

  // ---------- export (CSV/JSON) ----------
  // Uses fetch() with the Authorization header (same as every other
  // host-only call) rather than putting the host token in the URL, then
  // triggers a browser download from the resulting blob.
  async function downloadPollExport(format) {
    const errorEl = document.getElementById("host-error");
    errorEl.textContent = "";
    try {
      const res = await fetch(`${BACKEND_URL}/polls/${hostPollCode}/export?format=${format}`, {
        headers: { Authorization: `Bearer ${hostToken}` },
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        errorEl.textContent = data.message || "Failed to export poll.";
        return;
      }
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `poll_${hostPollCode}.${format === "csv" ? "csv" : "json"}`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    } catch (err) {
      errorEl.textContent = "Could not reach backend: " + err.message;
    }
  }

  document.getElementById("host-export-csv-btn").addEventListener("click", () => downloadPollExport("csv"));
  document.getElementById("host-export-json-btn").addEventListener("click", () => downloadPollExport("json"));

  // ---------- analytics panel ----------
  let analyticsLoaded = false;

  function renderAnalytics(data) {
    const panel = document.getElementById("host-analytics-panel");
    const fmtSeconds = (s) => (s === null || s === undefined ? "n/a" : `${s.toFixed(1)}s`);
    const optionLines = data.tally
      .map((t) => `<div class="analytics-line">&nbsp;&nbsp;${t.text}: <strong>${t.count}</strong></div>`)
      .join("");
    panel.innerHTML = `
      <div class="analytics-line"><strong>Participants joined:</strong> ${data.participants_joined}</div>
      <div class="analytics-line"><strong>Participants answered:</strong> ${data.participants_answered}</div>
      <div class="analytics-line"><strong>Response rate:</strong> ${data.response_rate_percent.toFixed(1)}%</div>
      <div class="analytics-line"><strong>Time to first vote:</strong> ${fmtSeconds(data.seconds_to_first_vote)}</div>
      <div class="analytics-line"><strong>Time to last vote:</strong> ${fmtSeconds(data.seconds_to_last_vote)}</div>
      <div class="analytics-line"><strong>Breakdown:</strong></div>
      ${optionLines}
    `;
  }

  document.getElementById("host-analytics-toggle").addEventListener("click", async () => {
    const panel = document.getElementById("host-analytics-panel");
    const errorEl = document.getElementById("host-error");
    const willShow = panel.classList.contains("hidden");
    if (!willShow) {
      panel.classList.add("hidden");
      return;
    }
    panel.classList.remove("hidden");
    if (analyticsLoaded) return;
    try {
      const res = await fetch(`${BACKEND_URL}/polls/${hostPollCode}/analytics`, {
        headers: { Authorization: `Bearer ${hostToken}` },
      });
      const data = await res.json();
      if (!res.ok) {
        errorEl.textContent = data.message || "Failed to load analytics.";
        return;
      }
      renderAnalytics(data);
      analyticsLoaded = true;
    } catch (err) {
      errorEl.textContent = "Could not reach backend: " + err.message;
    }
  });

  // ---------------------------------------------------------------------
  // PARTICIPANT FLOW
  // ---------------------------------------------------------------------
  let participantToken = null;
  let participantPollCode = null;
  let participantSocket = null;
  let hasAnswered = false;

  document.getElementById("participant-join-btn").addEventListener("click", () => {
    const errorEl = document.getElementById("participant-join-error");
    errorEl.textContent = "";

    const pollCode = document.getElementById("participant-code").value.trim().toUpperCase();
    const displayName = document.getElementById("participant-name").value.trim();

    if (!pollCode || !displayName) {
      errorEl.textContent = "Enter a poll code and a display name.";
      return;
    }

    participantSocket = io(BACKEND_URL);

    participantSocket.on("connect", () => {
      participantSocket.emit(
        "join_poll",
        { poll_code: pollCode, display_name: displayName },
        (ack) => {
          if (!ack || !ack.token) {
            // Server-side failure is reported via the "error" event handler below.
            return;
          }
          participantToken = ack.token;
          participantPollCode = pollCode;
          hasAnswered = false;

          document.getElementById("participant-closed-banner").classList.add("hidden");
          document.getElementById("participant-status").textContent = "";
          document.getElementById("participant-error").textContent = "";
          renderParticipantOptions(ack.poll);

          showView("voting");
          setJoinSubview("live");
          location.hash = "#join/" + pollCode;
        }
      );
    });

    participantSocket.on("error", (err) => {
      const msg = err.message || "Something went wrong.";
      const joinErrorEl = document.getElementById("participant-join-error");
      const liveErrorEl = document.getElementById("participant-error");
      if (participantToken) {
        liveErrorEl.textContent = msg;
      } else {
        joinErrorEl.textContent = msg;
      }
    });

    participantSocket.on("poll_closed", () => {
      document.getElementById("participant-closed-banner").classList.remove("hidden");
      document.querySelectorAll(".option-choice").forEach((btn) => (btn.disabled = true));
    });
  });

  function renderParticipantOptions(poll) {
    document.getElementById("participant-question-display").textContent = poll.question;
    renderExpiresLine("participant-expires-line", poll.expires_at);

    const optionsDiv = document.getElementById("participant-options");
    optionsDiv.innerHTML = "";
    const sorted = [...poll.options].sort((a, b) => a.position - b.position);
    for (const opt of sorted) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "option-choice";
      btn.textContent = opt.text;
      btn.addEventListener("click", () => submitAnswer(opt.id));
      optionsDiv.appendChild(btn);
    }
  }

  function submitAnswer(optionId) {
    if (hasAnswered) return;
    document.getElementById("participant-error").textContent = "";

    participantSocket.emit(
      "submit_answer",
      { token: participantToken, option_id: optionId },
      (ack) => {
        if (ack && ack.status === "ok") {
          hasAnswered = true;
          document.querySelectorAll(".option-choice").forEach((btn) => (btn.disabled = true));
          document.getElementById("participant-status").textContent =
            "Thanks — your answer was recorded.";
        }
        // A failure ack (undefined/null) is reported via the "error" event handler.
      }
    );
  }

  // ---------------------------------------------------------------------
  // Initial route (handles a fresh "/" load and a direct/refreshed
  // "#host/{code}" or "#join/{code}" load, e.g. from a bookmark).
  // ---------------------------------------------------------------------
  route();
</script>

</body>
</html>
